<style>
  :root {
    --bg: #07131B;
    --bg-soft: #0C1F2B;
    --card: #15291D;
    --ink: #E9F2EB;
    --ink-soft: #9DB5A4;
    --leaf: #58B883;
    --leaf-bright: #7FD6A4;
    --gold: #E3B341;
    --line: rgba(157, 181, 164, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: radial-gradient(ellipse 130% 90% at 75% 110%, #10293E 0%, #07131B 45%, #050B10 100%);
    color: var(--ink);
    font-family: 'Figtree', system-ui, sans-serif;
    font-size: 1.0425rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  ::selection { background: rgba(88, 184, 131, 0.35); }
  a { color: var(--leaf-bright); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--leaf); outline-offset: 3px; border-radius: 3px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 clamp(1.25rem, 5vw, 3rem); }
  h1, h2, h3 { font-family: 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em; }
  .accent { color: var(--leaf-bright); }

  /* three.js background */
  #bg3d {
    position: fixed; inset: 0; z-index: -1;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* progress bar */
  .progress { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--leaf), var(--gold)); z-index: 100; transition: width 80ms linear; }

  /* nav */
  nav.bar {
    position: sticky; top: 0; z-index: 90;
    backdrop-filter: blur(10px);
    background: rgba(7, 19, 27, 0.8);
    border-bottom: 1px solid var(--line);
  }
  nav.bar .inner { display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 0; gap: 1rem; flex-wrap: wrap; }
  .brand { display: inline-flex; align-items: center; gap: 0.65rem; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 1rem; color: var(--ink); text-decoration: none; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; flex: none;

    background: linear-gradient(135deg, var(--leaf), #2b6f4d);

  nav.bar .links a { margin-left: clamp(0.7rem, 2.2vw, 1.6rem); font-size: 0.93rem; color: var(--ink-soft); text-decoration: none; padding-bottom: 0.2rem; }

  /* hero */
  .hero { padding: clamp(4.5rem, 11vw, 8rem) 0 clamp(3.5rem, 8vw, 6rem); }
  .eyebrow { color: var(--gold); font-weight: 600; font-size: clamp(0.95rem, 1.8vw, 1.1rem); letter-spacing: 0.02em; }
  .hero h1 {
    font-weight: 800;

    line-height: 1.08;
    margin: 0.8rem 0 1.4rem;

  .typed-line { color: var(--ink-soft); font-weight: 600; display: block; }
  .typed-line .caret { color: var(--gold); font-weight: 400; }
  .hero .lede { max-width: 48ch; color: var(--ink-soft); font-size: clamp(1.05rem, 2vw, 1.2rem); }
  .hero-cta { margin-top: 2.2rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  .btn {
    display: inline-block; font-weight: 700; font-size: 1rem; text-decoration: none;
    padding: 0.85rem 1.9rem; border-radius: 999px; transition: transform 160ms ease, box-shadow 160ms ease;
  }
  .btn.primary { background: var(--leaf); color: #07130C; }
  .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(88,184,131,0.3); }
  .btn.ghost { border: 1.5px solid var(--line); color: var(--ink); }
  .btn.ghost:hover { border-color: var(--leaf); color: var(--leaf-bright); }
  .now-badge { display: inline-flex; align-items: center; gap: 0.55rem; color: var(--ink-soft); font-size: 0.95rem; }
  .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); position: relative; flex: none; }
  .pulse::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid var(--gold); animation: ring 1.8s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(0.4); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }

  /* staggered hero entrance */
  .stagger > * { opacity: 0; transform: translateY(22px); animation: rise 700ms cubic-bezier(0.22,1,0.36,1) forwards; }
  .stagger > *:nth-child(1) { animation-delay: 80ms; }
  .stagger > *:nth-child(2) { animation-delay: 200ms; }
  .stagger > *:nth-child(3) { animation-delay: 340ms; }
  .stagger > *:nth-child(4) { animation-delay: 480ms; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* sections + reveal */
  section { padding: clamp(3rem, 7vw, 4.5rem) 0; }
  .reveal { opacity: 0; transform: translateY(28px); transition: opacity 700ms cubic-bezier(0.22,1,0.36,1), transform 700ms cubic-bezier(0.22,1,0.36,1); }
  .reveal.in { opacity: 1; transform: none; }
  .reveal.d1 { transition-delay: 100ms; } .reveal.d2 { transition-delay: 200ms; } .reveal.d3 { transition-delay: 300ms; } .reveal.d4 { transition-delay: 400ms; }
  h2.sec {
    font-weight: 700;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    text-align: center;
    margin-bottom: clamp(1.8rem, 4vw, 2.6rem);

  /* cards (borrowed structure: stacked panels under a centered title) */
  .panel {
    background: rgba(21, 41, 29, 0.88);
    border: 1px solid var(--line);
    border-radius: 16px;

  .panel:hover { border-color: rgba(88, 184, 131, 0.4); }
  .panel h3 { font-weight: 600; font-size: clamp(1.25rem, 2.6vw, 1.6rem); margin-bottom: 0.9rem; }
  .panel p { color: var(--ink-soft); max-width: 75ch; }
  .panel p + p { margin-top: 0.9rem; }
  .panel p strong { color: var(--ink); }

  ul.tri { list-style: none; margin-top: 0.9rem; }
  ul.tri li { position: relative; padding: 0.3rem 0 0.3rem 1.4rem; color: var(--ink-soft); }
  ul.tri li::before { content: "▸"; position: absolute; left: 0; color: var(--leaf); }

  .twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem 3rem; }
  .twocol h4 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 1.1rem; color: var(--ink); margin-top: 0.4rem; }

  /* timeline */
  .timeline { list-style: none; position: relative; max-width: 780px; margin: 0 auto; }
  .timeline::before { content: ""; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
  .timeline li { position: relative; padding: 0 0 2.6rem 2.4rem; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {

  .when { font-size: 0.9rem; color: var(--gold); font-weight: 600; }
  .timeline h3 { font-weight: 600; font-size: 1.3rem; margin: 0.2rem 0 0.1rem; }

  .duties { margin: 0.8rem 0 0 1.1rem; color: var(--ink-soft); max-width: 56ch; }

  /* contact */
  .contact-card {

    border: 1px solid rgba(88,184,131,0.3);

  }
  .contact-card h2 { font-size: clamp(1.7rem, 3.5vw, 2.3rem); font-weight: 700; margin-bottom: 0.7rem; }
  .contact-card > p { color: var(--ink-soft); max-width: 52ch; margin-bottom: 1.8rem; }
  .contact-list { list-style: none; display: grid; gap: 0.7rem; }
  .contact-list .k { display: inline-block; min-width: 5rem; color: var(--ink-soft); font-size: 0.95rem; }

  .copy-btn {

  footer { padding: 2.6rem 0 3rem; color: var(--ink-soft); font-size: 0.9rem; border-top: 1px solid var(--line); margin-top: 3rem; text-align: center; }

  @media (prefers-reduced-motion: reduce) {

    .stagger > *, .reveal { opacity: 1 !important; transform: none !important; }
    .typed-line .caret { display: none; }
  }
</style>

/* ---------- hooks ---------- */
function useReveal() {
  const ref = useRef(null);
  const [inView, setInView] = useState(REDUCED);
  useEffect(() => {
    if (REDUCED || !ref.current) { setInView(true); return; }
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setInView(true); obs.disconnect(); } },
      { threshold: 0.15 }
    );
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

function useTypewriter(words) {
  const [text, setText] = useState(REDUCED ? words[0] : "");
  useEffect(() => {
    if (REDUCED) return;
    let w = 0, i = 0, deleting = false, t;
    const tick = () => {
      const word = words[w];
      i = deleting ? i - 1 : i + 1;
      setText(word.slice(0, i));
      let delay = deleting ? 45 : 95;
      if (!deleting && i === word.length) { deleting = true; delay = 1800; }
      else if (deleting && i === 0) { deleting = false; w = (w + 1) % words.length; delay = 350; }
      t = setTimeout(tick, delay);
    };
    t = setTimeout(tick, 600);
    return () => clearTimeout(t);
  }, []);
  return text;
}

function useScrollProgress() {
  const [p, setP] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setP(max > 0 ? (h.scrollTop / max) * 100 : 0);
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return p;
}

/* ---------- three.js background ---------- */
function Background3D() {
  const ref = useRef(null);
  useEffect(() => {
    if (!window.THREE || !ref.current) return;

    const canvas = ref.current;
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);
    camera.position.z = 16;

    // starfield shell around the scene
    const starPos = new Float32Array(1700 * 3);
    for (let i = 0; i < starPos.length; i += 3) {
      const r = 130 + Math.random() * 170;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPos[i]     = r * Math.sin(phi) * Math.cos(theta);
      starPos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
      starPos[i + 2] = r * Math.cos(phi);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
      color: 0xdfe9ff, size: 0.6, transparent: true, opacity: 0.85,
      sizeAttenuation: true, depthWrite: false,
    }));
    scene.add(stars);

    // a few warm bright stars
    const goldPos = new Float32Array(60 * 3);
    for (let i = 0; i < goldPos.length; i += 3) {
      const r = 120 + Math.random() * 120;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      goldPos[i]     = r * Math.sin(phi) * Math.cos(theta);
      goldPos[i + 1] = r * Math.sin(phi) * Math.sin(theta);
      goldPos[i + 2] = r * Math.cos(phi);
    }
    const goldGeo = new THREE.BufferGeometry();
    goldGeo.setAttribute("position", new THREE.BufferAttribute(goldPos, 3));
    const goldStars = new THREE.Points(goldGeo, new THREE.PointsMaterial({
      color: 0xe3b341, size: 1.1, transparent: true, opacity: 0.9,
      sizeAttenuation: true, depthWrite: false,
    }));
    scene.add(goldStars);

    // lighting: one sun, faint cool fill
    const sunLight = new THREE.DirectionalLight(0xfff3d6, 1.7);
    sunLight.position.set(-20, 10, 12);
    scene.add(sunLight, new THREE.AmbientLight(0x2a3d4f, 0.8));

    // Earth, bottom-right, horizon curving into view
    const earth = new THREE.Group();
    earth.add(new THREE.Mesh(
      new THREE.SphereGeometry(11, 56, 56),
      new THREE.MeshPhongMaterial({ color: 0x1d4e89, emissive: 0x050f1d, shininess: 16 })
    ));
    earth.add(new THREE.Mesh(
      new THREE.SphereGeometry(11.05, 30, 22),
      new THREE.MeshBasicMaterial({ color: 0x58b883, wireframe: true, transparent: true, opacity: 0.07 })
    ));
    earth.add(new THREE.Mesh(
      new THREE.SphereGeometry(11.8, 56, 56),
      new THREE.MeshBasicMaterial({ color: 0x4f9fe8, transparent: true, opacity: 0.13, side: THREE.BackSide })
    ));
    earth.position.set(9.5, -14.5, -10);
    scene.add(earth);

    // small original satellite, orbiting the planet
    const sat = new THREE.Group();
    const satBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.34, 0.34, 1.3, 16),
      new THREE.MeshPhongMaterial({ color: 0xcfd6dd, shininess: 70 })
    );
    satBody.rotation.z = Math.PI / 2;
    sat.add(satBody);
    const panelMat = new THREE.MeshPhongMaterial({
      color: 0x14406e, emissive: 0x0a2240, shininess: 90, side: THREE.DoubleSide,
    });
    const panel1 = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.02, 0.8), panelMat);
    panel1.position.x = 1.65;
    const panel2 = panel1.clone();
    panel2.position.x = -1.65;
    sat.add(panel1, panel2);
    const dish = new THREE.Mesh(
      new THREE.ConeGeometry(0.3, 0.42, 14, 1, true),
      new THREE.MeshPhongMaterial({ color: 0xe3b341, shininess: 40, side: THREE.DoubleSide })
    );
    dish.position.y = 0.55;
    sat.add(dish);
    sat.position.set(0, 0, 14.6);
    const orbit = new THREE.Group();
    orbit.add(sat);
    orbit.position.copy(earth.position);
    orbit.rotation.x = 0.32;
    scene.add(orbit);

    // sizing
    const resize = () => {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    };
    resize();
    window.addEventListener("resize", resize);

    // mouse parallax
    const mouse = { x: 0, y: 0 };
    const onMove = (e) => {
      mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
      mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
    };
    if (!REDUCED) window.addEventListener("pointermove", onMove, { passive: true });

    let raf = 0;
    const clock = new THREE.Clock();
    const animate = () => {
      const t = clock.getElapsedTime();
      stars.rotation.y = t * 0.0045;
      goldStars.rotation.y = -t * 0.003;
      earth.rotation.y = t * 0.02;
      orbit.rotation.y = t * 0.1;
      sat.rotation.y = t * 0.4;
      sat.rotation.x = Math.sin(t * 0.3) * 0.2;
      camera.position.x += (mouse.x * 1.4 - camera.position.x) * 0.03;
      camera.position.y += (-mouse.y * 0.9 - camera.position.y) * 0.03;
      camera.lookAt(scene.position);
      renderer.render(scene, camera);
      raf = requestAnimationFrame(animate);
    };

    if (REDUCED) {
      renderer.render(scene, camera);
    } else {
      raf = requestAnimationFrame(animate);
    }

    const onVis = () => {
      if (REDUCED) return;
      if (document.hidden) cancelAnimationFrame(raf);
      else raf = requestAnimationFrame(animate);
    };
    document.addEventListener("visibilitychange", onVis);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", resize);
      window.removeEventListener("pointermove", onMove);
      document.removeEventListener("visibilitychange", onVis);
      scene.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) o.material.dispose();
      });
      renderer.dispose();
    };
  }, []);
  return <canvas id="bg3d" ref={ref} aria-hidden="true"></canvas>;
}

function Reveal({ as: Tag = "div", className = "", children, ...rest }) {
  const [ref, inView] = useReveal();
  return (
    <Tag ref={ref} className={`reveal ${inView ? "in" : ""} ${className}`} {...rest}>
      {children}
    </Tag>
  );
}

          <li>Day-to-day ICT operations and user support across the university</li>
          <li>Systems maintenance and troubleshooting alongside the ICT team</li>
          <li>Applying web and database coursework to practical, real-world tasks</li>
        </ul>
      </Reveal>

      <Reveal className="panel d3">
        <h3>Professional Approach</h3>
        <p>
          I'm an honest, collaborative worker who learns fast and delivers with minimal
          supervision. Give me a task and a deadline — I'll manage the rest, and I'll ask
          the right questions along the way. Outside of code, exploring new technology is
          genuinely what I do for fun.
        </p>
      </Reveal>
    </section>
  );
}

function Experience() {
  return (
    <section id="experience" className="wrap">
      <Reveal>
        <h2 className="sec">My <span className="accent">Journey</span></h2>
      </Reveal>
      <ol className="timeline">
        {JOURNEY.map((j, idx) => (
          <Reveal as="li" key={j.title} className={`d${idx + 1} ${j.current ? "current" : ""}`}>
            <span className="when">{j.when}{j.current ? " · Current" : ""}</span>
            <h3>{j.title}</h3>
            <span className="where">{j.where}</span>
            <p>{j.desc}</p>
            {j.duties && (
              <ul className="duties">
                {j.duties.map((d) => <li key={d}>{d}</li>)}
              </ul>
            )}
          </Reveal>
        ))}
      </ol>
    </section>
  );
}

function Skills() {
  return (
    <section id="skills" className="wrap">
      <Reveal>
        <h2 className="sec">Technical <span className="accent">Skills</span></h2>
      </Reveal>
      <Reveal className="panel d1">
        <div className="twocol">
          <div>
            <h4>Development</h4>
            <ul className="tri">
              <li>HTML &amp; CSS web development</li>
              <li>Programming fundamentals</li>
              <li>Database design &amp; management</li>
              <li>Problem-solving &amp; analytical thinking</li>
            </ul>
          </div>
          <div>
            <h4>Tools &amp; Working Style</h4>
            <ul className="tri">
              <li>Microsoft Word, Excel &amp; PowerPoint</li>
              <li>Clear communication &amp; teamwork</li>
              <li>Time management</li>
              <li>Quick learner — new tools don't scare me</li>
            </ul>
          </div>
        </div>
      </Reveal>
    </section>
  );
}

function Contact() {
  const [copied, setCopied] = useState("");
  const copy = useCallback((label, value) => {
    try {
      navigator.clipboard.writeText(value).then(
        () => { setCopied(label); setTimeout(() => setCopied(""), 1800); },
        () => {}
      );
    } catch (e) { /* clipboard unavailable */ }
  }, []);
  return (
    <section id="contact" className="wrap">
      <Reveal className="contact-card">
        <h2>Let's build something.</h2>
        <p>
          I'm open to attachment opportunities, junior roles and mentorship —
          anything that helps me grow as a developer. Reach out any time.
        </p>
        <ul className="contact-list">
          <li>
            <span className="k">Email</span>
            <a href={`mailto:${PROFILE.email}`}>{PROFILE.email}</a>
            <button className="copy-btn" onClick={() => copy("email", PROFILE.email)}>
              {copied === "email" ? "Copied ✓" : "Copy"}
            </button>
          </li>
          <li>
            <span className="k">Phone</span>
            <a href={`tel:${PROFILE.phoneHref}`}>{PROFILE.phone}</a>
            <button className="copy-btn" onClick={() => copy("phone", PROFILE.phone)}>
              {copied === "phone" ? "Copied ✓" : "Copy"}
            </button>
          </li>
        </ul>
      </Reveal>
    </section>
  );
}

function App() {
  const progress = useScrollProgress();
  return (
    <React.Fragment>
      <Background3D />
      <div className="progress" style={{ width: progress + "%" }}></div>
      <Nav />
      <Hero />
      <About />
      <Experience />
      <Skills />
      <Contact />
      <footer><div className="wrap">{PROFILE.fullName} · Built with React &amp; Three.js</div></footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
